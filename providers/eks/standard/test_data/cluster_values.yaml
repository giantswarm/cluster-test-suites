# Values provided here merge on top of the default values found in https://github.com/giantswarm/cluster-standup-teardown
global:
  providerSpecific:
    awsClusterRoleIdentityName: giantswarm-grizzly-wc-e2e-eks

  # Like in capa/standard, add a Karpenter node pool next to the managed node group. The fixed
  # size of `nodepool-0` ensures that only Karpenter can add the extra node that the scale test needs.
  # Requires an EKS release with `cluster-eks` >= v3.1.0 and `karpenter` >= v2.5.0.
  nodePools:
    nodepool-0:
      minSize: 2
      maxSize: 2
    np-karpntr:
      type: karpenter

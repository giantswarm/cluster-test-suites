# Values provided here merge on top of the default values found in https://github.com/giantswarm/cluster-standup-teardown
global:
  providerSpecific:
    awsClusterRoleIdentityName: giantswarm-grizzly-wc-e2e-eks

  # Like in capa/standard, add a Karpenter node pool next to the managed node group. The fixed
  # size of `nodepool-0` ensures that only Karpenter can add the extra node that the scale test needs.
  # Requires an EKS release with `cluster-eks` >= v3.1.0 and `karpenter` >= v2.5.0.
  nodePools:
    nodepool-0:
      minSize: 2
      maxSize: 2
    np-karpntr:
      type: karpenter
      requirements:
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values:
            - nitro
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values:
            - "4"
            - "8"
            - "16"
            - "32"
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
            - spot

  # Enable trivy-operator cluster compliance scanning so the report-only
  # compliance spec in the common suite gets CIS/NSA/PSS findings to report.
  # See: https://github.com/giantswarm/roadmap/issues/2624
  apps:
    securityBundle:
      values:
        apps:
          # The trivy server app stays disabled: it is only needed for
          # vulnerability scanning, which is turned off below. It also
          # requires a 5Gi PVC and 200m CPU the small test clusters cannot
          # always provide.
          trivyOperator:
            enabled: true
            # The suite setup drops trivy from the dependencies of
            # trivy-operator (internal/suite/trivy.go), as the form of
            # `dependsOn` depends on the security-bundle version.
        userConfig:
          trivyOperator:
            configMap:
              values:
                trivy-operator:
                  compliance:
                    # The default ('* */6 * * *') only fires during hours 0/6/12/18,
                    # so reports would usually still be empty during a test run.
                    cron: "*/5 * * * *"
                  operator:
                    clusterComplianceEnabled: true
                    # Scanners that feed the CIS/NSA/PSS compliance reports.
                    configAuditScannerEnabled: true
                    infraAssessmentScannerEnabled: true
                    rbacAssessmentScannerEnabled: true
                    # Not needed for compliance reports; avoids vulnerability scan
                    # jobs for every workload in the test cluster.
                    vulnerabilityScannerEnabled: false

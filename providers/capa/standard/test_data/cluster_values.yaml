# Values provided here merge on top of the default values found in https://github.com/giantswarm/cluster-standup-teardown
global:
  providerSpecific:
    awsClusterRoleIdentityName: giantswarm-grizzly-wc-e2e
    nodeTerminationHandlerEnabled: false # https://github.com/giantswarm/giantswarm/issues/32656

  # Add a Karpenter node pool alongside the ASG-based nodepool-0 from the base values.
  # This merges what was previously the separate capa/karpenter test suite into capa/standard,
  # testing both node provisioning models in a single run — which also reflects how customers
  # run in production (mixed ASG + Karpenter pools).
  # See: https://github.com/giantswarm/roadmap/issues/4249
  #
  # ARM/Graviton testing is layered in via test_data/cluster_values_arm.yaml when the
  # release under test supports it (E2E_RELEASE_VERSION >= v35.0.0). Keep this file
  # schema-compatible with older cluster-aws versions so release-test-suites runs on
  # older releases (e.g. v33.x, v34.x) don't break.
  # Enable trivy-operator cluster compliance scanning so the report-only
  # compliance spec in the common suite gets CIS/NSA/PSS findings to report.
  # See: https://github.com/giantswarm/roadmap/issues/2624
  apps:
    securityBundle:
      values:
        apps:
          trivy:
            enabled: true
          trivyOperator:
            enabled: true
        userConfig:
          trivyOperator:
            configMap:
              values:
                trivy-operator:
                  compliance:
                    # The default ('* */6 * * *') only fires during hours 0/6/12/18,
                    # so reports would usually still be empty during a test run.
                    cron: "*/5 * * * *"
                  operator:
                    clusterComplianceEnabled: true
                    # Scanners that feed the CIS/NSA/PSS compliance reports.
                    configAuditScannerEnabled: true
                    infraAssessmentScannerEnabled: true
                    rbacAssessmentScannerEnabled: true
                    # Not needed for compliance reports; avoids vulnerability scan
                    # jobs for every workload in the test cluster.
                    vulnerabilityScannerEnabled: false

  nodePools:
    nodepool-0:
      minSize: 1
      maxSize: 1
    np-karpntr:
      type: karpenter
      requirements:
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values:
            - nitro
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values:
            - "4"
            - "8"
            - "16"
            - "32"
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
            - spot
